   DESIGN TOKENS
   ========================================================= */

  --bg: #050810;

  --text: #f5f7ff;
  --muted: #9ca8bd;
  --muted-2: #c5cede;

  --cyan: #5ee7df;
  --purple: #a78bfa;
  --green: #67e8a5;
  --yellow: #f5d76e;
  --red: #ff7188;

  --shadow:

  --shadow-small:

  --radius: 24px;
  --radius-small: 15px;

  --max: 1200px;

  --nav: 72px;

  --ease:

}

  --surface: rgba(0,0,0,.035);
