<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Raghavan — AI, Python and software developer portfolio."
  >

  <meta name="author" content="Raghavan">
  <meta name="theme-color" content="#080b12">

  <title>Raghavan | AI & Python Developer</title>

  <style>
    /* =========================================================
       RAGHAVAN PORTFOLIO
       Permanent Core Version
       Single-file architecture
       No external dependencies
       ========================================================= */

    :root {
      --bg: #080b12;
      --bg-secondary: #0d111a;
      --card: #111722;
      --card-hover: #151d2b;
      --border: #202a3a;

      --text: #f5f7fb;
      --muted: #a7b0c0;

      --accent: #7c8cff;
      --accent-light: #9da8ff;
      --cyan: #5ee7df;
      --green: #67e8a5;

      --max-width: 1120px;
      --radius: 18px;
    }

    /* =========================
       RESET
       ========================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(124, 140, 255, 0.12),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 30%,
          rgba(94, 231, 223, 0.07),
          transparent 28%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(92%, var(--max-width));
      margin: 0 auto;
    }

    /* =========================
       ACCESSIBILITY
       ========================= */

    :focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
    }

    /* =========================
       NAVIGATION
       ========================= */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      background: rgba(8, 11, 18, 0.94);
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      min-height: 68px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .logo span {
      color: var(--cyan);
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 24px;

      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-menu a {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 650;

      transition:
        color 0.2s ease;
    }

    .nav-menu a:hover {
      color: var(--text);
    }

    .menu-toggle {
      display: none;

      width: 42px;
      height: 42px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--card);
      color: var(--text);

      cursor: pointer;
    }

    /* =========================
       HERO
       ========================= */

    .hero {
      min-height: 100vh;

      display: flex;
      align-items: center;

      padding: 120px 0 80px;
    }

    .hero-content {
      max-width: 850px;
    }

    .
